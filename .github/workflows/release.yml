name: Release client

# Publish @paid-tw/ubn to npm on a tag like `ubn-v0.1.0`, then create the
# matching GitHub Release from that version's CHANGELOG.md section.
# Uses npm OIDC trusted publishing (no token, with provenance): configure the
# package's trusted publisher on npmjs.com to this repo + this workflow first.
on:
  push:
    tags: ['ubn-v*']

permissions:
  contents: read
  id-token: write # OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs a recent npm.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: npm publish --provenance --access public

  # A separate job so a failed release can be re-run (Re-run failed jobs)
  # without publishing to npm again, which would fail on the existing version.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Not marked latest: the daily dataset release (`data-latest`) owns that slot.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#ubn-v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi
          awk -v h="## [$version]" 'index($0, h) == 1 { f = 1; next } /^## \[/ { f = 0 } f' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for [$version]"
            exit 1
          fi
          printf "\n---\n\nnpm: [\`@paid-tw/ubn@%s\`](https://www.npmjs.com/package/@paid-tw/ubn/v/%s)\n" \
            "$version" "$version" >> "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --verify-tag --title "@paid-tw/ubn $version" \
            --notes-file "$RUNNER_TEMP/notes.md" --latest=false
