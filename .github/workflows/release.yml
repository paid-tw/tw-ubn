name: Release client

# Publish @paid-tw/ubn to npm on a tag like `ubn-v0.1.0`.
# Uses npm OIDC trusted publishing (no token, with provenance): configure the
# package's trusted publisher on npmjs.com to this repo + this workflow first.
on:
  push:
    tags: ['ubn-v*']

permissions:
  contents: read
  id-token: write # OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs a recent npm.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: npm publish --provenance --access public
