name: Build dataset

on:
  schedule:
    # 23:30 UTC (~07:30 Asia/Taipei). MOF re-publishes the active zip ~21:00 UTC,
    # so running later avoids picking up the previous day's extract.
    - cron: '30 23 * * *'
  workflow_dispatch: # manual trigger + keeps the schedule from auto-pausing
    inputs:
      allow_shrink:
        description: Publish even if rows dropped more than the sanity-check limit (intentional shrink)
        type: boolean
        default: false

permissions:
  contents: write # create releases / upload assets

concurrency:
  group: dataset
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # R2 / D1 write credentials live in this environment, restricted to the
    # default branch (see docs/operations.md). Until it is configured, repo-level
    # secrets of the same names still resolve.
    environment: dataset
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned to a master-branch commit; the toolchain must be explicit (see ci.yml).
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Previous run's state.tsv (held on the rolling `data-latest` release) lets
      # the pipeline emit only the day's delta. Absent on the first run.
      - name: Fetch previous state
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_SHRINK: ${{ inputs.allow_shrink == true }}
        run: |
          mkdir -p prev
          if gh release download data-latest --pattern 'state.tsv.gz' --dir prev 2>/dev/null; then
            gunzip -f prev/state.tsv.gz
            echo "PREV=--prev prev/state.tsv" >> "$GITHUB_ENV"
          else
            echo "no previous state (first run) — delta will be a full load"
          fi
          # Previous manifest, for the row-count sanity check. Only a confirmed
          # "release not found" counts as a first run; any other lookup error,
          # or a data-latest without manifest.json, fails the run so an outage
          # can't disguise a row drop as a missing baseline.
          if ASSETS=$(gh release view data-latest --json assets -q '.assets[].name' 2>&1); then
            if grep -qx manifest.json <<<"$ASSETS"; then
              gh release download data-latest --pattern manifest.json --dir prev
            elif [ "$ALLOW_SHRINK" = true ]; then
              echo "::warning::data-latest has no manifest.json; continuing because allow_shrink is set"
            else
              echo "::error::data-latest exists but has no manifest.json (re-run with allow_shrink to publish anyway)"
              exit 1
            fi
          elif grep -q 'release not found' <<<"$ASSETS"; then
            echo "no data-latest release (first run) — no baseline for the sanity check"
          else
            echo "::error::could not look up data-latest: $ASSETS"
            exit 1
          fi

      - name: Build pipeline
        run: cargo build --release -p ubn-build

      - name: Run pipeline
        run: ./target/release/ubn-build --out dist --shards 8192 $PREV

      - name: Read manifest
        id: m
        run: |
          echo "date=$(jq -r .dataDate dist/manifest.json)" >> "$GITHUB_OUTPUT"
          echo "tag=data-$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "delta=$(jq -c .delta dist/manifest.json)" >> "$GITHUB_OUTPUT"

      # Gate: nothing below (release, data-latest state, D1, R2 latest.json) runs
      # if the new build lost more than MAX_DROP_PCT of the previous rows, has
      # no rows, or has a malformed manifest. Override an intentional shrink by
      # running the workflow manually with allow_shrink; schedules can't set it.
      - name: Sanity check
        env:
          ALLOW_SHRINK: ${{ inputs.allow_shrink == true }}
          MAX_DROP_PCT: ${{ vars.DATASET_MAX_DROP_PCT }} # repo variable; empty = 1
        run: node scripts/check-dataset.mjs dist/manifest.json prev/manifest.json

      # Full artifacts + the delta/state -> a dated GitHub Release, and the
      # rolling `data-latest` keeps the fresh state.tsv.gz for tomorrow's diff.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gzip -kf dist/state.tsv
          tar -czf dist/shards.tar.gz -C dist shards
          # 顯名聲明 from the Rust manifest (attribution.exhibit / statement / licenseUrl).
          # Omitting it means the Open Government Data License was not granted.
          jq -r '
            .attribution.exhibit,
            "",
            .attribution.statement,
            "",
            ("政府資料開放授權條款：" + .attribution.licenseUrl),
            "",
            ("FIA tax registry snapshot " + (.dataDate // "unknown") + ". rows=" + (.rows | tostring) + "."),
            ("Delta " + (.delta | tostring) + ".")
          ' dist/manifest.json > dist/release-notes.md
          gzip -kf dist/d1/full.sql
          # GitHub refuses a 0-byte asset (HTTP 400 Bad Content-Length), and
          # `upload --clobber` deletes the existing asset before uploading, so
          # one empty file (delta.sql on a same-day rerun with no changes)
          # aborts the step after deleting assets it had not re-uploaded yet.
          # Leave empty files out.
          ASSETS=""
          for f in dist/ubn.ndjson.gz dist/ubn.sqlite dist/shards.tar.gz dist/manifest.json \
                   dist/state.tsv.gz dist/d1/schema.sql dist/d1/migrate.sql dist/d1/delta.sql \
                   dist/d1/full.sql.gz dist/changed-shards.txt; do
            if [ -s "$f" ]; then
              ASSETS="$ASSETS $f"
            else
              echo "::notice::not uploading empty $f"
            fi
          done
          if ! gh release create "${{ steps.m.outputs.tag }}" $ASSETS \
                --title "Dataset ${{ steps.m.outputs.date }}" \
                --notes-file dist/release-notes.md; then
            # Same-day rerun: the release exists. Replace its assets AND refresh
            # the title/notes so the attribution and version match the new data.
            gh release upload "${{ steps.m.outputs.tag }}" $ASSETS --clobber
            gh release edit "${{ steps.m.outputs.tag }}" \
              --title "Dataset ${{ steps.m.outputs.date }}" \
              --notes-file dist/release-notes.md
          fi
          gh release upload data-latest dist/state.tsv.gz dist/manifest.json --clobber \
          || gh release create data-latest dist/state.tsv.gz dist/manifest.json \
            --title "latest" --notes "rolling state for incremental diffs"

      # Apply only the delta to D1 — the whole point of the incremental build.
      # Gating lives in the script: a step-level `if` cannot see env vars the
      # step itself defines, so it would never run.
      - name: Apply D1 delta
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE: ${{ secrets.D1_DATABASE }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$D1_DATABASE" ]; then
            echo "D1 secrets not set; skipping D1 apply"; exit 0
          fi
          npx -y wrangler@4 d1 execute "$D1_DATABASE" --remote --file dist/d1/schema.sql -y
          # Upgrade pre-existing databases: add any new columns, ignoring the
          # duplicate-column error a freshly-created table raises.
          while IFS= read -r stmt; do
            [ -z "$stmt" ] && continue
            npx -y wrangler@4 d1 execute "$D1_DATABASE" --remote --command "$stmt" -y 2>/dev/null || true
          done < dist/d1/migrate.sql
          # D1 tracks its OWN applied checkpoint, kept separate from dataset
          # publication: "<state-sha> <target-fingerprint>", where state-sha is
          # the sha256 of the state.tsv it reflects and target-fingerprint is a
          # sha256 of account/database (so the raw secrets are never published).
          # The delta is valid only when BOTH match: the same target, at the
          # state the build diffed FROM. A fresh/behind D1, or a changed target
          # (e.g. D1_DATABASE repointed at a new database), forces a full reload
          # so unchanged rows are never left missing.
          TARGET=$(printf '%s/%s' "$CLOUDFLARE_ACCOUNT_ID" "$D1_DATABASE" | sha256sum | cut -d' ' -f1)
          BASE=""
          if [ -f prev/state.tsv ]; then BASE=$(sha256sum prev/state.tsv | cut -d' ' -f1); fi
          CK_STATE=""; CK_TARGET=""
          if gh release download data-latest --pattern d1-checkpoint.txt --dir d1ck 2>/dev/null; then
            read -r CK_STATE CK_TARGET < d1ck/d1-checkpoint.txt || true
          fi
          if [ -n "$BASE" ] && [ "$CK_STATE" = "$BASE" ] && [ "$CK_TARGET" = "$TARGET" ]; then
            if [ -s dist/d1/delta.sql ]; then
              npx -y wrangler@4 d1 execute "$D1_DATABASE" --remote --file dist/d1/delta.sql -y
            else
              echo "no row changes today"
            fi
          else
            echo "D1 fresh/out-of-sync or target changed; full reload"
            npx -y wrangler@4 d1 execute "$D1_DATABASE" --remote --file dist/d1/full.sql -y
          fi
          # Record the state D1 now reflects + the target it was applied to.
          printf '%s %s\n' "$(sha256sum dist/state.tsv | cut -d' ' -f1)" "$TARGET" > d1-checkpoint.txt
          gh release upload data-latest d1-checkpoint.txt --clobber

      # Shards -> R2 (the static serving origin), versioned + immutable, behind
      # the Cloudflare CDN. R2 writes are cheap, so this uploads the full set;
      # changed-shards.txt is published for anyone serving from a stable path.
      - name: Sync shards to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ]; then
            echo "R2 secrets not set; skipping R2 sync"; exit 0
          fi
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          EP="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          V="v/$(date +%Y%m%d)"
          aws s3 sync dist/shards "s3://$R2_BUCKET/$V/shards" \
            --endpoint-url "$EP" --checksum-algorithm CRC32 \
            --content-type application/json --cache-control 'public, max-age=31536000, immutable'
          aws s3 cp dist/manifest.json "s3://$R2_BUCKET/$V/manifest.json" \
            --endpoint-url "$EP" --content-type application/json
          printf '{"latest":"%s"}' "$V" > latest.json
          aws s3 cp latest.json "s3://$R2_BUCKET/latest.json" \
            --endpoint-url "$EP" --content-type application/json \
            --cache-control 'public, max-age=300'
