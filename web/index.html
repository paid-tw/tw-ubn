<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tw-ubn demo</title>
    <style>
      :root { color-scheme: light dark; }
      body { font: 16px/1.5 system-ui, sans-serif; max-width: 34rem; margin: 2rem auto; padding: 0 1rem; }
      input { font: inherit; padding: 0.5rem 0.6rem; width: 12rem; }
      .out { margin-top: 1rem; padding: 0.8rem 1rem; border-radius: 8px; background: color-mix(in srgb, Canvas 92%, CanvasText); }
      .muted { opacity: 0.6; }
      code { font-family: ui-monospace, monospace; }
      footer { margin-top: 2.5rem; font-size: 0.85rem; }
      footer a { color: inherit; }
    </style>
  </head>
  <body>
    <h1>統編 → 抬頭</h1>
    <p class="muted">輸入 8 碼統一編號，自動帶出營業人名稱。</p>
    <input id="ban" inputmode="numeric" maxlength="8" placeholder="22099131" autocomplete="off" />
    <div id="out" class="out muted">等待輸入…</div>

    <script type="module">
      // Point this at your CDN (R2 behind Cloudflare). Shards are published under
      // a versioned prefix (v/<date>/shards/<n>.json) named by latest.json.
      const BASE_URL = 'https://ubn.example.com';
      const SHARDS = 8192;

      // Resolve the current version once (latest.json is tiny and edge-cached),
      // falling back to a flat /shards/ layout. Cached for the page's lifetime.
      let shardsDirPromise;
      function shardsDir() {
        shardsDirPromise ??= fetch(`${BASE_URL}/latest.json`)
          .then((r) => (r.ok ? r.json() : null))
          .then((j) => (j && j.latest ? `${BASE_URL}/${j.latest}/shards` : `${BASE_URL}/shards`))
          .catch(() => `${BASE_URL}/shards`);
        return shardsDirPromise;
      }

      const WEIGHTS = [1, 2, 1, 2, 1, 2, 4, 1];
      function validateUBN(ban) {
        if (!/^\d{8}$/.test(ban)) return false;
        let sum = 0;
        for (let i = 0; i < 8; i++) {
          const p = Number(ban[i]) * WEIGHTS[i];
          sum += Math.floor(p / 10) + (p % 10);
        }
        if (sum % 5 === 0) return true;
        return ban[6] === '7' && (sum + 1) % 5 === 0;
      }
      function shardOf(ban) {
        let h = 0x811c9dc5;
        for (let i = 0; i < ban.length; i++) { h ^= ban.charCodeAt(i); h = Math.imul(h, 0x01000193); }
        return (h >>> 0) % SHARDS;
      }

      const input = document.getElementById('ban');
      const out = document.getElementById('out');
      let timer;

      function show(msg, muted = false) {
        out.textContent = msg;
        out.classList.toggle('muted', muted);
      }

      async function lookup(ban) {
        if (!validateUBN(ban)) return show('統編格式/檢查碼不正確', true);
        show('查詢中…', true);
        try {
          const ctrl = new AbortController();
          const t = setTimeout(() => ctrl.abort(), 2000);
          const dir = await shardsDir();
          const res = await fetch(`${dir}/${shardOf(ban)}.json`, { signal: ctrl.signal });
          clearTimeout(t);
          const rows = await res.json();
          const rec = rows.find((r) => r.ban === ban);
          show(rec ? `${rec.name}${rec.address ? '｜' + rec.address : ''}` : '查無此統編（可改用官方 API 補漏）', !rec);
        } catch {
          show('查詢失敗，請手動輸入抬頭', true); // never block checkout
        }
      }

      input.addEventListener('input', () => {
        clearTimeout(timer);
        const ban = input.value.trim();
        if (ban.length === 8) timer = setTimeout(() => lookup(ban), 150); // debounce
        else show('等待輸入…', true);
      });
    </script>
    <footer class="muted">
      <p>資料來源：財政部財政資訊中心，全國營業(稅籍)登記資料集、全國營業(稅籍)登記(停業)資料集（版本為各次建置的擷取日期，見 manifest.json 的 <code>dataDate</code>）。</p>
      <p>此開放資料依政府資料開放授權條款 (Open Government Data License) 進行公眾釋出，使用者於遵守本條款各項規定之前提下，得利用之。</p>
      <p>政府資料開放授權條款：<a href="https://data.gov.tw/license">https://data.gov.tw/license</a></p>
    </footer>
  </body>
</html>
