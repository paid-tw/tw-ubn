[package]
name = "ubn-build"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Build the tw-ubn open dataset from the FIA daily tax-registry snapshot."

[[bin]]
name = "ubn-build"
path = "src/main.rs"

[dependencies]
ubn-core = { path = "../ubn-core" }
anyhow = "1.0.86"
ureq = "2.10.1"
zip = "2.2.0"
csv = "1.3.0"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
flate2 = "1.0.34"
rusqlite = { version = "0.32.1", features = ["bundled"] }
